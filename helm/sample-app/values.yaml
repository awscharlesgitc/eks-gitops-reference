replicaCount: 2

image:
  repository: "ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/sample-python-app"
  pullPolicy: IfNotPresent
  tag: "replace-with-git-sha"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

containerPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: false
  className: alb
  annotations: {}
  hosts:
    - host: sample.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

env:
  APP_VERSION: "1.0.0"
